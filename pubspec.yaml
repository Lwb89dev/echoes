name: echoes
description: "Echoes - offline-first note-taking app on the Nostr protocol."
publish_to: 'none'

# The build number (+N) jumps to 2014 here on purpose, not a typo: v0.3.0
# and (briefly, since fixed) v0.4.9 were built with `flutter build apk
# --split-per-abi`, which silently inflates versionCode with Flutter's own
# per-ABI offset (arm64 +2000) on top of the real number — v0.4.9 shipped as
# versionCode 2013 before that was caught. Android refuses to install a
# lower versionCode over a higher one already on a device, so every release
# below 2014 is invisible as an update to anyone who ever got one of those
# builds. Every release from here on must keep incrementing from 2014, never
# reset lower — see the "versionCode poisoning" project memory for the full
# incident writeups.
version: 1.1.2+2017

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management: Riverpod chosen over Provider because AsyncNotifier/
  # AsyncValue model async sync/fetch operations against relays better
  # (explicit loading/error/data states, no nested FutureBuilders).
  flutter_riverpod: ^3.3.2

  # Nostr protocol: key generation, event signing, relay management over websockets.
  dart_nostr: ^10.0.1

  # "Simple" local persistence: settings, relay list, misc flags.
  shared_preferences: ^2.5.5

  # Local persistence for notes (structured data, no codegen: Notes are
  # saved as Map<String, dynamic> serialized via manual toJson/fromJson,
  # which avoids hive_generator/build_runner — it currently conflicts with
  # the 'analyzer' versions required by dart_nostr/riverpod).
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Encrypted storage dedicated to the account private key (nsec). The
  # private key must never end up in plaintext SharedPreferences: this uses
  # the native keystore/keychain instead.
  flutter_secure_storage: ^10.3.1

  uuid: ^4.5.3
  connectivity_plus: ^7.2.0

  # Login via Amber (NIP-55 external signer, Android only): the app never
  # sees the private key, it delegates signing/encryption to Amber via intent.
  amberflutter: ^0.0.9

  # Low-level crypto primitives (secp256k1 EC point math, HMAC-SHA256,
  # ChaCha20) backing our own NIP-44 implementation — see
  # lib/utils/nip44.dart. dart_nostr doesn't implement NIP-44, and every
  # published Dart package that does (e.g. `nostr`) pulls in a `bip340`
  # version that needs pointycastle ^4.0.0, which conflicts with
  # dart_nostr's own (transitive, via bip39) pointycastle ^3.x requirement.
  # pointycastle itself has no such conflict, so implementing NIP-44
  # directly against it — instead of forcing a package-level
  # dependency_override — avoids the conflict entirely without touching
  # dart_nostr's own dependency tree.
  pointycastle: ^3.9.1

  # `@visibleForTesting` on the NIP-44 internals that test/nip44_test.dart
  # exercises directly against the official spec vectors.
  meta: ^1.16.0

  # At-rest encryption of local notes (Pbkdf2 + AES-GCM), when the user
  # turns on password protection.
  cryptography: ^2.9.0

  # Localization: official EU languages + Chinese/Russian/Japanese (see
  # lib/l10n/ and l10n.yaml).
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Notes export/import (Settings > Data): saveFile()/pickFiles(withData:)
  # need at least file_picker 8.x — pinned to ^8.0.0 explicitly, since an
  # unconstrained `flutter pub add` resolved to a much older 3.x that
  # predates that API.
  file_picker: ^8.0.0

  # "Support Echoes" tile in Settings: opens the developer's Lightning
  # address via a `lightning:` URI in whatever wallet app is installed.
  url_launcher: ^6.3.2

  # Uploading/downloading encrypted attachment blobs (Blossom/NIP-96 file
  # hosts) and fetching Nostr profile metadata/avatars.
  http: ^1.6.0

  # MediaType, for declaring an attachment's real (image/audio) category on
  # upload — some Blossom/NIP-96 hosts reject a generic content type.
  http_parser: ^4.1.2

  # SHA-256: cache keys for downloaded files (avatar, attachments) and
  # integrity hashes for uploaded/downloaded attachment blobs.
  crypto: ^3.0.7

  # App-private cache directory for the avatar image and decrypted
  # attachment files — never external/shared storage.
  path_provider: ^2.1.0

  # Microphone recording for voice notes.
  record: ^6.0.0

  # Voice message playback with a Telegram-style waveform (extracted from
  # the actual recording, not a placeholder), used in the note editor.
  audio_waveforms: ^2.0.2

  # Renders note bodies as markdown in Preview mode, with a custom image
  # builder for inline attachment images (see note_editor_screen.dart).
  # Community-maintained continuation of the now-discontinued
  # flutter_markdown, same API.
  flutter_markdown_plus: ^1.0.12

  # Google-Keep-style masonry grid for the optional note list layout (see
  # note_layout_provider.dart) — a plain GridView can't vary tile height
  # per note the way a masonry layout does.
  flutter_staggered_grid_view: ^0.7.0

  # Underline formatting (see lib/utils/underline_syntax.dart) needs
  # `DelimiterSyntax`/`DelimiterTag` directly — markdown has no native
  # underline syntax, so this is what implements Echoes' own `++text++`
  # convention on top of flutter_markdown_plus's parser. Was already a
  # transitive dependency of flutter_markdown_plus; pinned directly since
  # the app now imports it itself.
  markdown: ^7.3.1

  # Keeps the screen on while actively recording a voice note — a long
  # recording shouldn't be cut off (or just be awkward to babysit) because
  # the device fell asleep mid-take.
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # Generates lib/l10n/app_localizations*.dart from the ARB files, per l10n.yaml.
  generate: true

  assets:
    - assets/icon/
    - assets/splash/

# App icon source (see assets/icon/icon.png): a stack of colored sheets
# behind an off-white "echo" document — replaced 2026-10-02 (was the ivory
# notebook-and-quill mark). `icon.png` is a flattened square: the source
# artwork (assets/icon/icon-new.png) came as a rounded-squircle mockup on a
# black canvas, cropped to its bounding box and with that canvas color
# flood-filled to the artwork's own off-white tone instead of left black —
# every platform here applies its own squircle/circle mask on top, so a
# flat, edge-to-edge square (no baked-in corner rounding, no stray black in
# the corners once masked) is what they all want as the source. Regenerate
# platform variants with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  # The adaptive icon's two layers: a transparent foreground carrying the
  # mark over an OPAQUE brand tile. The background layer must be opaque —
  # Android's adaptive-icon spec says so, and a transparent one leaves the
  # launcher masking empty space, which is what made the drawer icon render
  # wrong once already (see git history around the notebook-and-quill icon).
  #
  # Unlike the old mark, this artwork has no built-in margin — the card
  # stack fills its own crop edge-to-edge — so the foreground source image
  # itself is pre-padded (to ~60% fill) to clear the 66dp/108dp (~61%)
  # safe-zone circle every launcher mask is guaranteed to keep, confirmed by
  # actually compositing+masking the generated foreground rather than just
  # eyeballing the flat PNG.
  # `adaptive_icon_foreground_inset` must stay explicit at 0 — omitting it
  # doesn't mean "no inset", the tool's own default is 16%, which stacked on
  # top of the pre-padding above shrank the icon down to a speck inside its
  # tile (confirmed by rendering the actual composited+masked result, not
  # just eyeballing the foreground PNG alone).
  adaptive_icon_background: "#FCF8F0"
  adaptive_icon_foreground: "assets/icon/android_adaptive_foreground.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#FCF8F0"
    theme_color: "#FCF8F0"
  # Windows embeds this as windows/runner/resources/app_icon.ico.
  # icon_squircle.png keeps the artwork's rounded-squircle silhouette on a
  # transparent canvas. icon.png stays the edge-to-edge square the Android
  # and iOS masks expect; pointing Windows at that file paints the corners
  # cream and the squircle disappears. Linux has no step here — hicolor
  # PNGs under flatpak/ are the same squircle, resized by hand.
  windows:
    generate: true
    image_path: "assets/icon/icon_squircle.png"
    icon_size: 256

# Native splash. The mark is the squircle itself (assets/icon/icon-new.png
# with the black canvas removed), not a square flood-fill of it. Android 12
# still masks the center image to a circle: splash_icon_android12.png is
# 1152px with the whole squircle inside the 768px safe circle, so the mask
# does not clip the corners. Regenerate with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  # Same backdrops as EchoesPalette, so the splash meets the first frame.
  color: "#F6EEFF"
  color_dark: "#160C28"
  image: assets/splash/splash_icon.png
  android_12:
    image: assets/splash/splash_icon_android12.png
    color: "#F6EEFF"
    color_dark: "#160C28"
  web: false
