name: Linux ARM64

# Static analysis, the existing x86_64 Linux target, and a native AArch64
# bundle. This does not upload a GitHub Release and it does not replace
# .github/workflows/build-linux.yml (tag-triggered Debian package).
# Flutter is pinned to the version the branch was analyzed and tested with.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.3"
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.3"
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            libstdc++-14-dev

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build linux --release
      - run: scripts/verify-linux-bundle-arch.sh build/linux/x64/release/bundle x86_64

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.3"
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            libstdc++-14-dev

      - name: Build the AArch64 bundle
        run: scripts/build-linux-aarch64.sh

      - uses: actions/upload-artifact@v4
        with:
          name: echoes-linux-aarch64-${{ github.sha }}
          path: |
            dist/echoes-linux-aarch64-*.tar.gz
            dist/echoes-linux-aarch64-*.tar.gz.sha256
          if-no-files-found: error
