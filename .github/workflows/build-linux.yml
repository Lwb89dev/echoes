name: Build Linux

# One amd64 .deb of the Linux desktop app, attached to the GitHub Release
# for the same tag that builds the Windows zip. There is no second Linux
# artifact: the package is the bundle, the menu launcher, and the session
# autostart entry.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            libstdc++-dev

      - run: flutter config --enable-linux-desktop

      - run: flutter pub get

      - name: Build the single .deb
        run: packaging/deb/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: echoes-linux-deb
          path: dist/echoes_*_amd64.deb

      - name: Attach the .deb to the matching GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/echoes_*_amd64.deb --clobber
